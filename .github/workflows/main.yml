name: Build Kanakku Pulla PRO V7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Latest V7 ZIP
        run: |
          ZIP_FILE=$(ls -1t KANAKKU_PULLA_PRO_ANDROID_FINAL_FIXED_V7*.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V7 ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V7 Project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q "$ZIP_FILE" -d android-build

      - name: Find Android Project Root
        run: |
          SETTINGS_FILE=$(find android-build -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found inside ZIP"
            find android-build -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p final-apk
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" final-apk/KANAKKU-PULLA-PRO-V7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANAKKU-PULLA-PRO-V7-APK
          path: final-apk/KANAKKU-PULLA-PRO-V7.apk
