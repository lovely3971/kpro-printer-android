name: Build Kanakku Pulla PRO V7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Extract V7 Project
        run: |
          echo "Files in repo:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'KANAKKU_PULLA_PRO_ANDROID_FINAL_FIXED_V7*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V7 ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android-build
          mkdir android-build
          unzip -q "$ZIP_FILE" -d android-build

      - name: Verify Android Project
        run: |
          test -f android-build/settings.gradle
          test -f android-build/build.gradle
          test -f android-build/app/build.gradle
          echo "Android project verified successfully"

      - name: Build APK
        working-directory: android-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANAKKU-PULLA-PRO-V7-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
