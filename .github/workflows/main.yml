name: Build Kanakku Pulla PRO V5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V5 Project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q KANAKKU_PULLA_PRO_ANDROID_FINAL_FIXED_V5.zip -d android-build
          echo "=== Extracted files ==="
          find android-build -maxdepth 2 -type f | head -50

      - name: Build APK
        run: |
          cd android-build
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANAKKU-PULLA-PRO-V5-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
