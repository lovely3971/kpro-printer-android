name: Build Kanakku Pulla PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Final Kanakku Pulla PRO V4
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q KANAKKU_PULLA_PRO_ANDROID_FINAL_FIXED_V4.zip -d android-build

      - name: Build Kanakku Pulla PRO APK
        working-directory: android-build/KANAKKU_PULLA_PRO_ANDROID_APK_FINAL_PROJECT
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANAKKU-PULLA-PRO-ANDROID-V4-APK
          path: android-build/KANAKKU_PULLA_PRO_ANDROID_APK_FINAL_PROJECT/app/build/outputs/apk/debug/app-debug.apk
