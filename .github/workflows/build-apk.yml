name: Build Kanakku Pulla PRO APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KANAKKU-PULLA-PRO-ANDROID-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Kanakku Pulla PRO Latest" --notes "Latest Android APK for in-app updates"
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
