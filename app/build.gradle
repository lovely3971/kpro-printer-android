plugins { id 'com.android.application' }

android {
    namespace 'com.lovelyshoppe.kanakkupullapro'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lovelyshoppe.kanakkupullapro'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.5.0-v8-auto-update-activation-fixed'
    }
    signingConfigs {
        debug {
            storeFile file('kanakku-debug.keystore')
            storePassword 'kanakkupulla'
            keyAlias 'kanakkudebugkey'
            keyPassword 'kanakkupulla'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
